spring.application.name=be-ecommerce-fernandezdiego
server.port=${PORT:8080}

# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_ecommerce_fernandezdiego}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ORM Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

seguridad.jwt.clave=ClaveSecretaSuperSeguraParaEcommerce2026UPNPeru
seguridad.jwt.expiracion-ms=3600000